name: CI

on:
  push:
    branches:
      - main  # Triggers on push to main branch
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run ts:check

      - name: Lint code
        run: npm run lint

      - name: Test
        run: npx vitest run

      # Vercel deploys through its own GitHub integration; this workflow uploads the same build to Hostinger.
      - name: Build project
        run: npm run build

      # Skipped until the FTP secrets are added in GitHub > Settings > Secrets and variables > Actions.
      - name: Deploy to Hostinger
        if: github.event_name == 'push' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
